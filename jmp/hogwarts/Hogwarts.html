const houses=[{id:'Gryffindor',icon:'🦁',color:'red',name:'GRYFFINDOR',traits:'용기 · 대담함 · 결단력 · 기사도',desc:'그리핀도르는 용기와 대담함, 그리고 자신의 신념을 지킬 수 있는 용기를 중요하게 생각합니다. 어려운 상황에서도 정면으로 도전하며, 쉽게 물러서지 않는 마법사들이 모이는 곳입니다. 무엇보다 자신의 용기를 믿는다면, 그리핀도르가 당신의 자리가 될지도 모릅니다.',en:'Courage · Bravery · Determination · Chivalry',edesc:'Gryffindor values courage, daring, and the strength to stand by your beliefs. Its members face difficult situations head-on and do not back down easily. If you trust your courage above all, Gryffindor may be your place.'},{id:'Ravenclaw',icon:'🦅',color:'blue',name:'RAVENCLAW',traits:'지성 · 지혜 · 호기심 · 배움',desc:'래번클로는 지성과 지혜, 그리고 세상에 대한 끊임없는 호기심을 중요하게 생각합니다. 단순히 답을 아는 데 그치지 않고, 왜 그것이 답인지 이해하려는 마법사들이 모이는 곳입니다. 배움이 어디로 이끌든 그 길을 따라가고 싶다면, 래번클로가 당신을 기다리고 있을지도 모릅니다.',en:'Intelligence · Wisdom · Curiosity · Learning',edesc:'Ravenclaw values intelligence, wisdom, and a lasting curiosity about the world. Its members want to understand why an answer is right, not simply know the answer. If you want to follow learning wherever it leads, Ravenclaw may be waiting.'},{id:'Hufflepuff',icon:'🦡',color:'yellow',name:'HUFFLEPUFF',traits:'충성 · 인내 · 성실 · 공정함',desc:'후플푸프는 인내와 성실함, 공정함, 그리고 정직하게 노력하는 자세를 중요하게 생각합니다. 뛰어난 재능만으로 이루어지는 성취보다, 꾸준한 노력과 끈기가 만들어내는 성취를 믿습니다. 정직함과 끈기를 중요하게 생각한다면, 후플푸프가 당신의 집이 될지도 모릅니다.',en:'Loyalty · Patience · Diligence · Fairness',edesc:'Hufflepuff values patience, diligence, fairness, and honest effort. Its members believe in achievements built through steady work and perseverance. If you value honesty and persistence, Hufflepuff may be your home.'},{id:'Slytherin',icon:'🐍',color:'green',name:'SLYTHERIN',traits:'야망 · 기지 · 자원 활용 · 결단력',desc:'슬리데린은 야망과 결단력, 기지, 그리고 어려운 상황을 전략적으로 헤쳐 나가는 능력을 중요하게 생각합니다. 자신이 무엇을 원하는지 알고, 그 목표를 이루기 위해 어떻게 행동해야 하는지를 신중하게 판단하는 마법사들이 모이는 곳입니다. 자신의 야망과 판단력을 믿는다면, 슬리데린이 당신을 기다리고 있을지도 모릅니다.',en:'Ambition · Cunning · Resourcefulness · Determination',edesc:'Slytherin values ambition, determination, cunning, and the ability to navigate difficult situations strategically. Its members know what they want and carefully decide how to reach it. If you trust your ambition and judgment, Slytherin may be waiting for you.'}];
const Q=[
{id:'Q1',title:'기숙사 배정식',enTitle:'The Sorting Ceremony',ko:'기숙사 배정식에서 마법의 모자가 해리에게 슬리데린 기숙사를 제안하자, 해리는 깊은 고민에 빠졌습니다. 해리는 **“용감한 마법사는 무조건 그리핀도르로 가야 하며, 슬리데린에 가면 무조건 사악한 마왕의 하수인이 된다”**며 오직 두 가지 선택지만 존재한다고 생각했습니다.\n\n해리의 사고방식에 포함된 논리적 오류는 무엇일까요?',en:'During the Sorting Ceremony, the Sorting Hat suggests that Harry might belong in Slytherin. Harry becomes deeply troubled. He thinks, “A brave wizard must go to Gryffindor, and anyone who goes to Slytherin will inevitably become a servant of the Dark Lord.” He assumes there are only two possible choices.\n\nWhat logical fallacy appears in Harry’s reasoning?',choices:['False Dilemma (거짓 딜레마 / 흑백논리)','Fallacy of Accident (우연의 오류)','Equivocation (애매어의 오류)','Straw Man Fallacy (짚단 논증의 오류)'],enChoices:['False Dilemma','Fallacy of Accident','Equivocation','Straw Man Fallacy'],answer:'A'},
{id:'Q2',title:'밤의 복도',enTitle:'The Corridor at Night',ko:'해리, 론, 헤르미온느, 네빌은 밤에 기숙사를 몰래 나왔다가 필치에게 들킬 위기에 처했습니다.\n\n헤르미온느가 말했습니다.\n“학생은 밤에 기숙사를 떠나면 안 된다는 규칙이 있으니, 우리가 규칙을 어긴 것은 맞아. 하지만 누군가 위험에 처해서 도움을 요청해야 하는 상황이라면 다를 수도 있어.”\n\n그러자 다른 학생이 말했습니다.\n“규칙은 모든 학생에게 적용되는 거야. 어떤 상황에서도 예외는 없어.”\n\n이 주장의 문제를 가장 잘 설명하는 것은?',en:'Harry, Ron, Hermione, and Neville secretly leave their dormitory at night and are in danger of being caught by Filch.\n\nHermione says: “There is a rule that students must not leave their dormitories at night, so we did break the rule. But the situation might be different if someone is in danger and we need to leave to get help.”\n\nAnother student responds: “The rule applies to every student. There are no exceptions, no matter what the situation is.”\n\nWhich best describes the problem with this reasoning?',choices:['False Dilemma (거짓 딜레마)','Fallacy of Accident (우연의 오류)','Appeal to Tradition (전통에 호소)','Begging the Question (선결문제 요구)'],enChoices:['False Dilemma','Fallacy of Accident','Appeal to Tradition','Begging the Question'],answer:'B'},
{id:'Q3',title:'마법약 수업',enTitle:'Potions Class',ko:'스네이프 교수가 말했습니다.\n“이 마법약은 위험하다.”\n\n학생 A는 이것을 듣고 “위험하다는 것은 절대로 사용해서는 안 된다는 뜻이다.”라고 주장했습니다.\n\n하지만 스네이프는 “위험하다”는 말을 **“잘못 사용하면 심각한 결과를 초래할 수 있다”**는 의미로 사용했습니다.\n\n이 상황에서 가장 적절한 개념은?',en:'Professor Snape says: “This potion is dangerous.”\n\nStudent A concludes: “If it is dangerous, it must never be used.”\n\nHowever, Snape meant “dangerous” to mean “capable of causing serious consequences if used improperly.”\n\nWhich concept best describes the problem?',choices:['Ambiguity (모호성)','Vagueness (애매성)','Equivocation (애매어의 오류)','Amphiboly (애매구문의 오류)'],enChoices:['Ambiguity','Vagueness','Equivocation','Amphiboly'],answer:'C'},
{id:'Q4',title:'말포이와 헤르미온느',enTitle:'Malfoy and Hermione',ko:'수업 중 말포이가 헤르미온느의 머글 출신 배경을 비꼬며 그녀를 놀렸습니다.\n헤르미온느가 불쾌해하자 론이 말했습니다.\n“사람의 출신 때문에 그 사람의 능력을 판단해서는 안 돼.”\n\n그러자 말포이가 대답했습니다.\n“그러니까 론은 순수혈통 마법사들이 가진 모든 전통과 가치가 잘못됐다고 생각하는 거네.”\n\n말포이의 논리적 오류는 무엇일까요?',en:'During class, Malfoy mocks Hermione because of her Muggle-born background. When Hermione becomes upset, Ron says: “We shouldn’t judge someone’s abilities based on where they come from.”\n\nMalfoy responds: “So Ron thinks that all the traditions and values of pure-blood wizards are wrong.”\n\nWhat logical fallacy is Malfoy committing?',choices:['Straw Man (허수아비 오류)','Red Herring (논점 일탈)','Loaded Question (복합질문 / 함정 질문)','Fallacy of Accident (우연의 오류)'],enChoices:['Straw Man','Red Herring','Loaded Question','Fallacy of Accident'],answer:'A'},
{id:'Q5',title:'첫 번째 퀴디치 경기',enTitle:'The First Quidditch Match',ko:'해리의 첫 퀴디치 경기에서 해리의 빗자루가 갑자기 심하게 흔들리기 시작했습니다.\n헤르미온느는 관중석에서 스네이프가 해리를 노려보고 있는 단 한 번의 단편적인 모습을 발견했습니다.\n\n헤르미온느가 말했습니다.\n\n“스네이프가 해리를 바라보고 있었어. 그러니까 스네이프가 해리의 빗자루를 저주한 게 틀림없어.”\n\n이 관찰을 바탕으로 헤르미온느가 내린 결론의 논리적 문제는 무엇일까요?',en:'During Harry\'s first Quidditch match, his broomstick suddenly begins to shake violently.\n\nFrom the stands, Hermione catches a single isolated glimpse of Snape staring at Harry.\n\nHermione says:\n\n“Snape was staring right at Harry. So Snape must have cursed Harry\'s broom.”\n\nWhat is the logical flaw in the conclusion Hermione draws from this observation?',choices:['Hasty Generalization (성급한 일반화)','Missing the Point / Non-sequitur (논점 일탈 / 추론 비약의 오류)','Red Herring (붉은 훈제어의 오류)','Fallacy of Accident (우연의 오류)'],enChoices:['Hasty Generalization','Missing the Point / Non-sequitur','Red Herring','Fallacy of Accident'],answer:'A'},
{id:'Q6',title:'예언 수업',enTitle:'Divination Class',ko:'점술 수업에서 파르바티는 **“이번 주에는 그리핀도르 학생들이 사고를 많이 칠 것이다”**라고 믿었습니다.\n다음 일주일 동안 그녀는 그리핀도르 학생이 규칙을 어긴 사례 3건을 기억했지만, 규칙을 잘 지킨 사례 30건은 거의 기억하지 못했습니다.\n\n이 현상을 가장 잘 설명하는 것은?',en:'In Divination class, Parvati believes: “Gryffindor students are going to cause a lot of trouble this week.”\n\nDuring the week, she remembers three cases in which Gryffindor students broke rules but barely remembers the thirty cases in which they followed the rules.\n\nWhich concept best explains this?',choices:['Confirmation Bias (확증편향)','Hindsight Bias (사후확신편향)','Sunk Cost Fallacy (매몰비용 오류)','Halo Effect (후광효과)'],enChoices:['Confirmation Bias','Hindsight Bias','Sunk Cost Fallacy','Halo Effect'],answer:'A'},
{id:'Q7',title:'마법사의 돌',enTitle:'The Philosopher’s Stone',ko:'네빌은 50갈레온을 주고 구입한 빗자루가 고장 났다는 사실을 알게 되었습니다. 새로운 빗자루를 사는 것이 훨씬 좋은 선택이지만, 그는 말합니다.\n“빗자루가 고장 나서 새 빗자루를 사야 하긴 하지만, 덕분에 빗자루를 직접 고치는 법을 배웠으니 오히려 잘된 일이야.”\n\n이 사고방식은?',en:'Neville discovers that the broom he bought for 50 Galleons is defective. Buying a new broom would clearly be the better choice, but he says: “The broom may be broken, but I learned how to repair a broom because of it, so perhaps it was actually a good thing.”\n\nWhat concept best describes this reasoning?',choices:['Confirmation Bias','Sunk Cost Fallacy','Sour Grapes','Sweet Lemon'],enChoices:['Confirmation Bias','Sunk Cost Fallacy','Sour Grapes','Sweet Lemon'],answer:'D'},
{id:'Q8',title:'마법의 역사',enTitle:'History of Magic',ko:'호그와트의 역사 시험에서 예상하지 못했던 사건이 출제되었습니다. 시험이 끝난 후 론은 말했습니다.\n“그 사건이 나올 줄 알았어. 문제를 보니까 너무 당연하더라.”\n\n하지만 시험 전에 론은 그 사건을 전혀 언급하지 않았습니다. 이 현상은?',en:'An unexpected event appears on a Hogwarts History exam. After the exam, Ron says: “I knew that event would be on the test. It was obvious once I saw the question.”\n\nHowever, Ron had never mentioned the event before the exam. What phenomenon does this illustrate?',choices:['Confirmation Bias','Hindsight Bias','Overconfidence','Availability Heuristic'],enChoices:['Confirmation Bias','Hindsight Bias','Overconfidence','Availability Heuristic'],answer:'B'},
{id:'Q9',title:'퀴디치 경기: 가장 기억에 남는 사건',enTitle:'Quidditch: The Most Memorable Incident',ko:'지난달 퀴디치 경기에서 한 학생이 빗자루에서 떨어져 크게 다쳤습니다. 그 사건을 눈 앞에서 생생하게 목격한 이후, 헤르미온느는 **“퀴디치는 매우 위험한 스포츠이므로 사고가 자주 발생할 것”**이라고 생각하기 시작했습니다.\n\n이는 어떤 인지 편향과 관련이 있을까요?',en:'During a Quidditch match last month, a student fell from a broomstick and was seriously injured. After witnessing the accident, Hermione begins to think: “Quidditch must be extremely dangerous, so serious accidents must happen frequently.”\n\nIf her judgment is mainly influenced by how vivid and easily remembered the accident is, which cognitive bias is involved?',choices:['Availability Heuristic (가용성 휴리스틱)','Confirmation Bias (확증편향)','Hindsight Bias (사후확신편향)','Sunk Cost Fallacy (매몰비용 오류)'],enChoices:['Availability Heuristic','Confirmation Bias','Hindsight Bias','Sunk Cost Fallacy'],answer:'A'},
{id:'Q10',title:'마법사의 돌을 지키는 시험',enTitle:'Protecting the Philosopher’s Stone',ko:'해리가 마법사의 돌을 찾으러 가기 전, 론이 말했습니다.\n“우리가 돌을 찾으면 덤블도어가 반드시 우리를 칭찬해 주실 거야. 분명 좋은 생각이야.”\n\n헤르미온느가 물었습니다.\n“그리핀도르의 기숙사 점수가 100점 깎이더라도 그렇게 말할 수 있어?”\n\n론은 갑자기 대답을 망설였습니다. 사실 그는 덤블도어가 어떻게 반응할지에 대한 확실한 근거가 거의 없었습니다.\n\n다음 중 론의 반응을 가장 잘 설명하는 것은 무엇일까요?',en:'Before Harry goes after the Philosopher’s Stone, Ron says: “If we find the Stone, Dumbledore will definitely praise us. It’s obviously a good idea.”\n\nHermione asks: “Would you still say that if Gryffindor lost 100 House Points because of it?”\n\nRon suddenly hesitates. In reality, he has very little evidence about how Dumbledore would actually respond.\n\nWhich best explains Ron’s reaction?',choices:['실제 이해관계가 생기자 자신의 실제 확신 수준을 더 정확하게 평가하기 시작했다.','내기를 제안받으면 사람은 항상 자신의 첫 번째 판단을 바꾸게 된다.','론은 덤블도어를 신뢰하지 않았기 때문에 대답을 망설였다.','다른 사람에게 자신의 의견을 말하는 것은 합리적인 판단을 방해한다.'],enChoices:['Once real stakes were involved, he began to assess his actual level of confidence more accurately.','People always change their initial judgment when they are asked to make a bet.','Ron hesitated because he did not trust Dumbledore.','Expressing an opinion to someone else prevents rational judgment.'],answer:'A'}];
const TARGET={Q1:'C',Q2:'A',Q3:'D',Q4:'B',Q5:'C',Q6:'A',Q7:'B',Q8:'D',Q9:'A',Q10:'C'};
Q.forEach(q=>{const t='ABCD'.indexOf(TARGET[q.id]),c='ABCD'.indexOf(q.answer);if(t===c)return;for(const k of['choices','enChoices']){const a=q[k],x=a.splice(c,1)[0];a.splice(t,0,x)}q.answer=TARGET[q.id]});
const tiers=[95,75,60,45,30];let lang='ko',state=JSON.parse(localStorage.getItem('hogwarts-game')||'null'),liveScores={};const $=s=>document.querySelector(s), app=$('#app');
function save(){localStorage.setItem('hogwarts-game',JSON.stringify(state))}function points(){return state?.answers.reduce((s,a)=>s+a.points,0)||0}
function scoreMarkup(){return `<div id="scoreStrip" class="score-strip">${houses.map(h=>`<div class="score-house ${h.color}"><span>${h.icon} ${h.name}</span><b>${(liveScores[h.id]??(state?.house===h.id?points():0))>0?'+':''}${liveScores[h.id]??(state?.house===h.id?points():0)}</b></div>`).join('')}</div>`}
function personalMarkup(){return `<div class="personal-strip"><span>${esc(state.name)} · ${state.house}${state.rank?` · ${lang==='ko'?state.rank+'위':'#'+state.rank}`:''}</span><b>${lang==='ko'?'개인 점수':'PERSONAL SCORE'}　${points()>0?'+':''}${points()}</b><small>${state.answers.filter(a=>a.correct).length}/${Q.length} ${lang==='ko'?'정답':'correct'}　·　${state.index}/${Q.length} ${lang==='ko'?'제출':'answered'}</small></div>`}
async function refreshStandings(){try{let r=await fetch('/api/standings',{cache:'no-store'});if(!r.ok)return;liveScores=await r.json();let el=$('#scoreStrip');if(el)el.outerHTML=scoreMarkup()}catch(_){}}
function textBlock(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
$('#langButton').onclick=()=>{lang=lang==='ko'?'en':'ko'; if(!$('#stage').hidden) render(); else {document.querySelector('.copy-ko').hidden=lang!=='ko';document.querySelector('.copy-en').hidden=lang!=='en';$('#begin').textContent=lang==='ko'?'기숙사 배정식 시작　→':'Begin the Sorting　→'}};
$('#begin').onclick=()=>{state={id:crypto.randomUUID(),name:'',house:'',index:0,answers:[]};save();render()};
function render(){const stage=$('#stage');$('#begin').hidden=true;$('.hero').hidden=true;stage.hidden=false;stage.innerHTML=state.house?(state.ruled?questionView():rulesView()):setupView();if(state.house)refreshStandings();if(state.house&&state.index>=Q.length)refreshFinalResults()}
function setupView(){let isName=!state.name;return `<div class="stage-head"><p class="eyebrow">${lang==='ko'?'마법의 분류 모자':'THE SORTING HAT'}</p><h2>${isName?(lang==='ko'?'참가자 이름을 입력하세요':'Enter your name'):(lang==='ko'?'어느 기숙사를 대표할까요?':'Choose your House')}</h2>${isName?`<label class="name-label">${lang==='ko'?'이름':'Name'}<input id="playerName" maxlength="80" autocomplete="name" placeholder="${lang==='ko'?'이름 입력':'Your name'}"></label><button class="gold-button" id="nameNext">${lang==='ko'?'계속':'Continue'}　→</button>`:`<p class="subtle">${lang==='ko'?'기숙사 특징만 보고 선택하세요.':'Choose based on each House’s traits.'}</p>`}</div>${isName?'':`<div class="house-grid">${houses.map(h=>`<button class="house-card ${h.color}" data-house="${h.id}"><span class="house-icon">${h.icon}</span><b>${h.name}</b><span class="traits">${lang==='ko'?h.traits:h.en}</span><span>${lang==='ko'?h.desc:h.edesc}</span></button>`).join('')}</div>`}`}

function calibrationSvg(rows){const W=720,H=440,L=76,R=24,T=24,B=74,x=v=>L+(v-30)/70*(W-L-R),y=v=>T+(100-v)/100*(H-T-B),ticks=[30,45,60,75,95],yticks=[0,20,40,60,80,100],map=new Map(rows.map(r=>[r.confidence,r]));let grid=yticks.map(v=>`<g><line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#817866" stroke-opacity=".35"/><text x="${L-12}" y="${y(v)+5}" text-anchor="end">${v}%</text></g>`).join('');let xt=ticks.map(v=>`<g><line x1="${x(v)}" y1="${H-B}" x2="${x(v)}" y2="${H-B+5}" stroke="#2d2a26"/><text x="${x(v)}" y="${H-B+25}" text-anchor="middle">${v}%</text></g>`).join('');let points=ticks.filter(v=>map.has(v)).map(v=>({c:v,a:Number(map.get(v).accuracy),n:map.get(v).count}));let actual=points.map(p=>`${x(p.c)},${y(p.a)}`).join(' ');let dots=points.map(p=>`<circle cx="${x(p.c)}" cy="${y(p.a)}" r="7" fill="#934951" stroke="#fffaf0" stroke-width="2"><title>${p.c}% confidence: ${p.a}% correct (${p.n} answers)</title></circle>`).join('');return `<div class="calibration-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calibration chart comparing stated confidence and observed accuracy">${grid}<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#2d2a26" stroke-width="2"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#2d2a26" stroke-width="2"/><line x1="${x(30)}" y1="${y(30)}" x2="${x(100)}" y2="${y(100)}" stroke="#333" stroke-width="2.5" stroke-dasharray="11 9"/>${actual?`<polyline points="${actual}" fill="none" stroke="#934951" stroke-width="3" stroke-linejoin="round"/>`:''}${dots}${xt}<text x="${(L+W-R)/2}" y="${H-12}" text-anchor="middle" class="axis-title">WHEN YOU FEEL SURE OF YOUR ANSWER</text><text transform="translate(20 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" class="axis-title">OBSERVED ACCURACY</text></svg><div class="chart-legend"><span><i class="ideal-key"></i> Ideal calibration</span><span><i class="actual-key"></i> Observed accuracy</span></div></div>`}
function drawDashboard(d){let board=$('#dashboard');board.innerHTML=`<section class="admin-summary"><h3>Confidence calibration</h3><p class="subtle">Each point compares a confidence level with the share of answers that were correct. Points above the dashed line indicate underconfidence; below it indicate overconfidence.</p>${calibrationSvg(d.calibration)}<div class="table-wrap"><table><thead><tr><th>Confidence</th><th>Responses</th><th>Correct</th><th>Observed accuracy</th></tr></thead><tbody>${d.calibration.map(x=>`<tr><td>${x.confidence}%</td><td>${x.count}</td><td>${x.correct}</td><td>${x.accuracy}%</td></tr>`).join('')}</tbody></table></div></section><section class="admin-summary"><h3>House standings</h3><div class="house-totals">${houses.map(h=>`<div class="total ${h.color}">${h.icon} ${h.name}<b>${d.participants.filter(p=>p.house===h.id).reduce((sum,p)=>sum+p.score,0)}</b></div>`).join('')}</div></section><section class="admin-summary"><h3>Raw responses</h3><button class="gold-button" id="export">Export CSV</button><div class="table-wrap"><table><thead><tr><th>Participant</th><th>House</th><th>Question</th><th>Answer</th><th>Confidence</th><th>Correct</th><th>Points</th><th>Time</th></tr></thead><tbody>${d.responses.map(r=>`<tr><td>${esc(r.participant)}</td><td>${r.house}</td><td>${r.questionId}</td><td>${r.answer}</td><td>${r.confidence}%</td><td>${r.correct?'Yes':'No'}</td><td>${r.points}</td><td>${new Date(r.submittedAt).toLocaleString()}</td></tr>`).join('')}</tbody></table></div></section>`;$('#export').onclick=()=>csv(d.responses)}

function drawDashboard(d){let board=$('#dashboard');let qRowsFor=p=>d.responses.filter(r=>r.participantId===p.id);let headers=`<tr><th rowspan="2">Participant</th><th rowspan="2">House</th><th rowspan="2">Correct</th><th rowspan="2">Final score</th><th rowspan="2">Points lost</th>${Q.map(q=>`<th colspan="4">${q.id}: ${esc(q.title)}</th>`).join('')}</tr><tr>${Q.map(()=>'<th>Answer</th><th>Confidence</th><th>Correct</th><th>Points</th>').join('')}</tr>`;let rows=d.participants.map(p=>{let qs=qRowsFor(p),byId=Object.fromEntries(qs.map(r=>[r.questionId,r]));return `<tr><td>${esc(p.name)}</td><td>${p.house}</td><td>${p.correct_count}/${Q.length}</td><td>${p.score}</td><td>${p.points_lost}</td>${Q.map(q=>{let a=byId[q.id];return a?`<td>${a.answer}</td><td>${a.confidence}%</td><td>${a.correct?'Yes':'No'}</td><td>${a.points>0?'+':''}${a.points}</td>`:'<td>—</td><td>—</td><td>—</td><td>—</td>'}).join('')}</tr>`}).join('');board.innerHTML=`<section class="admin-summary"><h3>Confidence calibration</h3><p class="subtle">Each point compares a confidence level with the share of answers that were correct. Points above the dashed line indicate underconfidence; below it indicate overconfidence.</p>${calibrationSvg(d.calibration)}<div class="table-wrap"><table><thead><tr><th>Confidence</th><th>Responses</th><th>Correct</th><th>Observed accuracy</th></tr></thead><tbody>${d.calibration.map(x=>`<tr><td>${x.confidence}%</td><td>${x.count}</td><td>${x.correct}</td><td>${x.accuracy}%</td></tr>`).join('')}</tbody></table></div></section><section class="admin-summary"><h3>House standings</h3><div class="house-totals">${houses.map(h=>`<div class="total ${h.color}">${h.icon} ${h.name}<b>${d.participants.filter(p=>p.house===h.id).reduce((sum,p)=>sum+p.score,0)}</b></div>`).join('')}</div></section><section class="admin-summary"><h3>Raw responses · one row per participant</h3><p class="subtle">Each participant appears once. Every question is grouped into answer, confidence, correctness, and poin function exportFormCSV(d){let keys=['participant','house','correctCount','finalScore','pointsLost'];let header=['Participant','House','Correct','Final score','Points lost'];Q.forEach(q=>{keys.push(`${q.id}_answer`,`${q.id}_confidence`,`${q.id}_correct`,`${q.id}_points`);header.push(`${q.id} answer`,`${q.id} confidence`,`${q.id} correct`,`${q.id} points`)});let quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let lines=[header.map(quote).join(',')];for(const p of d.participants){let byId=Object.fromEntries(d.responses.filter(r=>r.participantId===p.id).map(r=>[r.questionId,r]));let vals=[p.name,p.house,`${p.correct_count}/${Q.length}`,p.score,p.points_lost];Q.forEach(q=>{let r=byId[q.id];vals.push(r?.answer||'',r?`${r.confidence}%`:'',r?(r.correct?'Yes':'No'):'',r?r.points:'')});lines.push(vals.map(quote).join(','))}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='hogwarts-house-cup-google-forms-style.csv';a.click();URL.revokeObjectURL(a.href)}

{s:'🏆',x:()=>'<div class="house-row">'+houses.map(h=>`<span class="${h.color}">${h.icon}</span>`).join('')+'</div>',ko:{t:'네 기숙사, 하나의 컵',b:'<p>내 점수는 곧 <b>기숙사 점수</b>입니다. 문제를 제출할 때마다 <b>개인 순위</b>와 <b>기숙사 순위</b>가 공개됩니다.</p><p>이름을 적고, 마법의 모자 앞에서 기숙사를 고르세요.</p>'},en:{t:'Four Houses, One Cup',b:'<p>Your points are your <b>House points</b>. After every answer, your <b>personal rank</b> and <b>House rank</b> are revealed.</p><p>Enter your name, then choose your House before the Sorting Hat.</p>'}}
];
const RP=[
{s:'⚖',pre:()=>{const h=houses.find(x=>x.id===state.house);return h?`<p>${h.icon} <b>${h.name}</b>${ko()?'의 대표로 출전합니다.':' — you now compete for this House.'}</p>`:''},x:()=>`<div class="two-step"><div><b>${ko()?'① 답 고르기':'① Pick an answer'}</b>${ko()?'선지 A–D 중 하나':'One of A–D'}</div><div><b>${ko()?'② 확신도 걸기':'② Bet your confidence'}</b>95 · 75 · 60 · 45 · 30%</div></div>`,ko:{t:'문제마다 두 번 선택합니다',b:'<p>먼저 답을 고르고, 그 답이 맞을 확률에 얼마나 걸지 정하세요. 확신도는 곧 <b>판돈</b>입니다.</p><p>전혀 모르겠다면 30%, 거의 확실하다면 95%.</p>'},en:{t:'Two Choices Per Question',b:'<p>Pick an answer, then decide how much to wager on being right. Your confidence is your <b>stake</b>.</p><p>No idea? 30%. Almost certain? 95%.</p>'}},
{s:'⚡',x:()=>`<div class="ledger">${tiers.map(n=>`<div class="lrow ${n===simTier?'on':''}" data-t="${n}"><div class="l"><span style="width:${n}%">−${n}</span></div><b>${n}%</b><div class="r"><span style="width:${n}%">+${n}</span></div></div>`).join('')}</div><p class="warn">${ko()?'95%를 걸고 틀리면 <b>−95</b>. 30%를 건 정답 세 번(+90)으로도 메울 수 없습니다.':'Bet 95% and miss: <b>−95</b>. Three correct 30% answers (+90) cannot cover it.'}</p><div class="sim"><span>${ko()?'판돈':'Bet'} <b id="simTier">${simTier}</b>%</span><span class="sim-score" id="simScore">0</span><button class="gold-button" data-sim="1">${ko()?'맞았다 ✓':'Right ✓'}</button><button class="ghost" data-sim="-1">${ko()?'틀렸다 ✗':'Wrong ✗'}</button></div><p>${ko()?'대변인처럼 자신 있는 척하지 말고, 정찰병처럼 <b>“정말 이 확률에 걸 수 있는가?”</b>를 물으세요.':'Don’t sound sure like a press secretary. Ask like a scout: <b>“Would I really bet on this?”</b>'}</p>`,ko:{t:'맞히면 +판돈, 틀리면 −판돈',b:'<p>예외는 없습니다. 판돈을 눌러 직접 걸어 보세요.</p>'},en:{t:'Right: +Stake. Wrong: −Stake.',b:'<p>No exceptions. Tap a stake and try it yourself.</p>'}}
];
let ip=0,rp=0,simTier=95,simScore=0;const ko=()=>lang==='ko';
function cardHTML(P,i,k,label){const p=P[i],T=p[lang],last=i===P.length-1;return `<article class="intro-card page-in"><div class="seal">${p.s}</div><h2>${T.t}</h2>${p.pre?p.pre():''}${T.b}${p.x?p.x():''}</article><div class="intro-nav"><button class="ghost" id="${k}Prev" ${i?'':'disabled'}>← ${ko()?'이전':'Back'}</button><div class="intro-dots">${P.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><button class="gold-button" id="${k}Next">${last?label:(ko()?'다음':'Next')}　→</button></div>`}
function renderIntro(){$('.hero').classList.toggle('compact',ip>0);$('#intro').innerHTML=cardHTML(IP,ip,'ip',ko()?'기숙사 배정식 시작':'Begin the Sorting')}
function rulesView(){return cardHTML(RP,rp,'rp',ko()?'문제 풀기 시작':'Start the Quiz')}
function ruleClick(e){const t=e.target;
const row=t.closest('.lrow');if(row){simTier=+row.dataset.t;document.querySelectorAll('.lrow').forEach(r=>r.classList.toggle('on',r===row));$('#simTier').textContent=simTier;return}
const s=t.closest('[data-sim]');if(s){const v=+s.dataset.sim;simScore+=v*simTier;const el=$('#simScore');el.textContent=(simScore>0?'+':simScore<0?'−':'')+Math.abs(simScore);el.className='sim-score '+(v>0?'up':'down');void el.offsetWidth;el.classList.add('hit');return}
if(t.id==='ipPrev'){ip--;renderIntro()}else if(t.id==='ipNext'){if(ip<IP.length-1){ip++;renderIntro()}else{state={id:crypto.randomUUID(),name:'',house:'',index:0,answers:[]};save();render()}}
else if(t.id==='rpPrev'){rp--;render()}else if(t.id==='rpNext'){if(rp<RP.length-1){rp++;render()}else{state.ruled=true;save();render()}}}
$('#intro').addEventListener('click',ruleClick);$('#stage').addEventListener('click',ruleClick);
$('#langButton').onclick=()=>{lang=ko()?'en':'ko';if(!$('#stage').hidden)render();else renderIntro()};
renderIntro();
(function(){const w=document.createElement('div');w.className='candles';let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;for(let i=0;i<26;i++){const c=document.createElement('i');c.className='candle';c.style.cssText=`--x:${(r()*96+2).toFixed(1)}%;--y:${(r()*38+3).toFixed(1)}%;--d:${(3+r()*3).toFixed(1)}s;animation-delay:-${(r()*4).toFixed(1)}s;height:${18+(r()*16|0)}px`;w.appendChild(c)}document.body.prepend(w)})();
async function refreshRanks(delta){try{const r=await fetch('/api/results',{cache:'no-store'});if(!r.ok)return;const d=await r.json(),el=$('#answerRankings');if(!el)return;const k=ko(),ps=(d.participants||[]).slice().sort((a,b)=>b.score-a.score),mine=ps.find(p=>p.id===state.id),ms=mine?mine.score:points(),rank=ps.filter(p=>p.score>ms).length+1,total=Math.max(ps.length,1);
const hs=houses.map(h=>({...h,score:(d.houses||{})[h.id]||0})).sort((a,b)=>b.score-a.score),myH=hs.find(h=>h.id===state.house),hr=hs.filter(h=>h.score>myH.score).length+1,pr=state.rank,ph=state.hrank;state.rank=rank;state.hrank=hr;save();
const mv=(p,n)=>p?(p>n?`<em class="mv up">▲ ${p-n}</em>`:p<n?`<em class="mv down">▼ ${n-p}</em>`:'<em class="mv">–</em>'):'',ord=n=>k?`${n}<sup>위</sup>`:`<sup>#</sup>${n}`;
const up=ps.filter(p=>p.score>ms).sort((a,b)=>a.score-b.score)[0],dn=ps.filter(p=>p.score<ms).sort((a,b)=>b.score-a.score)[0];
const chase=up?(k?`바로 위 순위까지 <b>${up.score-ms}점</b>`:`<b>${up.score-ms} pts</b> to the next rank`):dn?(k?`개인 1위 — 추격자와 <b>${ms-dn.score}점</b> 차`:`1st — <b>${ms-dn.score} pts</b> ahead`):(k?'개인 1위':'1st place');
const ha=hs.filter(h=>h.score>myH.score).pop(),hb=hs.filter(h=>h.score<myH.score)[0];
const hchase=ha?(k?`${ha.name}까지 <b>${ha.score-myH.score}점</b>`:`<b>${ha.score-myH.score} pts</b> behind ${ha.name}`):hb?(k?`기숙사 선두 — 2위와 <b>${myH.score-hb.score}점</b> 차`:`House lead: <b>${myH.score-hb.score} pts</b>`):(k?'기숙사 선두':'House lead');
const hmin=Math.min(...hs.map(h=>h.score)),hmax=Math.max(...hs.map(h=>h.score)),sg=n=>(n>0?'+':'')+n,medal=['🥇','🥈','🥉','4'];
const hrows=hs.map((h,i)=>`<div class="lad ${h.color} ${h.id===state.house?'me':''}"><b>${medal[hs.filter(x=>x.score>h.score).length]}</b><span>${h.icon} ${h.name}</span><span class="bar"><i style="width:${hmax===hmin?50:8+(h.score-hmin)/(hmax-hmin)*92}%"></i></span><b>${sg(h.score)}</b></div>`).join('');
const hc=Object.fromEntries(houses.map(h=>[h.id,h]));const prow=(p,n,me)=>`<div class="lad ${hc[p.house]?.color||''} ${me?'me':''}"><b>${n}</b><span>${esc(p.name)}${me?(k?' (나)':' (you)'):''} ${hc[p.house]?.icon||''}</span><small>${p.correct_count}/${Q.length}</small><b>${sg(p.score)}</b></div>`;
const top=ps.slice(0,5).map(p=>prow(p,ps.filter(x=>x.score>p.score).length+1,p.id===state.id)).join('')+(mine&&rank>5?'<p class="subtle" style="text-align:center;margin:0">⋯</p>'+prow(mine,rank,true):'');
el.innerHTML=`<div class="rank-hero"><div class="rank-box"><small>${k?'내 개인 순위':'YOUR RANK'}</small><b>${ord(rank)}</b><span class="subtle">/ ${total}${k?'명':''}</span>${mv(pr,rank)}</div><div class="rank-box"><small>${k?'우리 기숙사 순위':'YOUR HOUSE'}</small><b>${ord(hr)}</b><span class="subtle">${myH.icon} ${myH.name}</span>${mv(ph,hr)}</div></div><p class="chase">${chase}　·　${hchase}</p><h3>${k?'기숙사 대항전':'HOUSE CUP STANDINGS'}</h3><div class="ladder">${hrows}</div><h3>${k?'개인 순위 TOP 5':'TOP 5'}</h3><div class="ladder">${top}</div>`}catch(_){}}
</script></body></html>
